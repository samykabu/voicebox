name: Sanduq workflow gates
on:
  pull_request:
permissions:
  contents: read
jobs:
  workflow-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # LOCAL EDIT (not in the Sanduq template): ci_gate.py requires at least one
      # feature and has no empty-mapping escape hatch, so it fails every PR that
      # touches no specs/ evidence. Gate the run instead of failing chore PRs.
      # install.py --apply restores the template; re-apply this afterwards and
      # update ci_sha256 in .specify/workflow/install-receipt.json.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base HEAD "$BASE_SHA")"
          if git diff --name-only "$base" HEAD \
            | grep -Eq '^(specs/|\.specify/workflow/pr-features\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No specs/ evidence and no pr-features.json in this PR; gate not applicable."
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.13'
      - run: python -m pip install -r .specify/extensions/workflow/requirements.txt
        if: steps.scope.outputs.run == 'true'
      - name: Verify selected processes and all changed feature evidence
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .specify/extensions/workflow/scripts/ci_gate.py --base-ref "$BASE_SHA" --check-index
